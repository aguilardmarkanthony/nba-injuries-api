name: Production freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: production-freshness
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check background refresh and snapshot age
        run: python scripts/check_freshness.py
      - name: Record failure
        if: failure()
        run: |
          echo '::error::NBA freshness monitor failed. Inspect source refresh logs and /v1/freshness.'
          echo 'NBA freshness could not be verified. Check the probe output and Render source refresh logs.' >> "$GITHUB_STEP_SUMMARY"
